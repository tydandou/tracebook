<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tracebook</title>
  <desc id="desc">A local, evidence-backed memory layer for coding agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#10233e"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <g opacity="0.18" stroke="#8fdcff" stroke-width="1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <g transform="translate(92 62)">
    <path d="M18 186C72 186 67 114 123 114S174 196 230 196s56-132 112-132 52 66 108 66"
          fill="none" stroke="url(#trace)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#dff6ff" stroke="#38bdf8" stroke-width="4">
      <circle cx="18" cy="186" r="10"/>
      <circle cx="123" cy="114" r="10"/>
      <circle cx="230" cy="196" r="10"/>
      <circle cx="342" cy="64" r="10"/>
      <circle cx="450" cy="130" r="10"/>
    </g>
    <g fill="#a78bfa" opacity="0.9">
      <rect x="78" y="44" width="78" height="12" rx="6"/>
      <rect x="272" y="218" width="112" height="12" rx="6"/>
      <rect x="386" y="16" width="62" height="12" rx="6"/>
    </g>
  </g>

  <g transform="translate(620 88)" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="64" font-size="62" font-weight="750" letter-spacing="7">TRACEBOOK</text>
    <text x="2" y="115" font-size="25" font-weight="500" fill="#bae6fd">Memory that survives the chat.</text>
    <g transform="translate(2 152)" font-size="16" font-weight="600" fill="#cbd5e1">
      <text x="0" y="0">LOCAL</text>
      <circle cx="70" cy="-6" r="3" fill="#38bdf8"/>
      <text x="88" y="0">EVIDENCE-BACKED</text>
      <circle cx="260" cy="-6" r="3" fill="#a78bfa"/>
      <text x="278" y="0">AGENT-NATIVE</text>
    </g>
  </g>
</svg>
