<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Tracebook social preview</title>
  <desc id="desc">Memory that survives the chat. Local, evidence-backed project memory for coding agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.55" stop-color="#102542"/>
      <stop offset="1" stop-color="#0a1627"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <g opacity="0.16" stroke="#8fdcff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>

  <g transform="translate(84 100)">
    <path d="M18 310C82 310 78 216 144 216s61 108 127 108 65-196 132-196 62 96 128 96"
          fill="none" stroke="url(#trace)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#e0f7ff" stroke="#38bdf8" stroke-width="5">
      <circle cx="18" cy="310" r="12"/>
      <circle cx="144" cy="216" r="12"/>
      <circle cx="271" cy="324" r="12"/>
      <circle cx="403" cy="128" r="12"/>
      <circle cx="531" cy="224" r="12"/>
    </g>
    <g fill="#a78bfa" opacity="0.95">
      <rect x="92" y="112" width="92" height="14" rx="7"/>
      <rect x="310" y="366" width="136" height="14" rx="7"/>
      <rect x="444" y="70" width="76" height="14" rx="7"/>
    </g>
  </g>

  <g transform="translate(676 132)" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="74" font-size="66" font-weight="750" letter-spacing="8">TRACEBOOK</text>
    <text x="2" y="142" font-size="32" font-weight="600" fill="#bae6fd">Memory that survives the chat.</text>
    <text x="2" y="198" font-size="21" fill="#d5e3f3">Evidence-backed project context</text>
    <text x="2" y="230" font-size="21" fill="#d5e3f3">for coding agents.</text>

    <g transform="translate(2 286)" font-size="16" font-weight="700">
      <rect x="0" y="-26" width="110" height="42" rx="21" fill="#0ea5e9" opacity="0.2" stroke="#38bdf8"/>
      <text x="28" y="1" fill="#e0f2fe">LOCAL</text>
      <rect x="126" y="-26" width="204" height="42" rx="21" fill="#8b5cf6" opacity="0.2" stroke="#a78bfa"/>
      <text x="152" y="1" fill="#ede9fe">NO SERVER / API KEY</text>
    </g>
  </g>

  <g transform="translate(84 566)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="0" font-size="18" font-weight="600" fill="#93c5fd">CODEX · CLAUDE CODE · OPEN AGENT SKILLS</text>
    <text x="1110" y="0" text-anchor="end" font-size="18" fill="#cbd5e1">github.com/tydandou/tracebook</text>
  </g>
</svg>
