name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: PowerShell 7 transport smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "PowerShell transport engine: $($PSVersionTable.PSVersion)"
          $today = python -c "from datetime import date; print(date.today().isoformat())"
          $request = Get-Content -LiteralPath tests/fixtures/multilingual-request.json -Raw -Encoding UTF8
          & plugins/tracebook/skills/tracebook/scripts/New-TracebookRequestEnvelope.ps1 -Json $request |
            python plugins/tracebook/skills/tracebook/scripts/tracebook_runner.py capture --root "$env:RUNNER_TEMP/tracebook-pwsh" --cwd "$env:GITHUB_WORKSPACE" --request - --today $today
      - name: Windows PowerShell 5.1 transport smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "PowerShell transport engine: $($PSVersionTable.PSVersion)"
          $today = python -c "from datetime import date; print(date.today().isoformat())"
          $request = Get-Content -LiteralPath tests/fixtures/multilingual-request.json -Raw -Encoding UTF8
          & plugins/tracebook/skills/tracebook/scripts/New-TracebookRequestEnvelope.ps1 -Json $request |
            python plugins/tracebook/skills/tracebook/scripts/tracebook_runner.py capture --root "$env:RUNNER_TEMP/tracebook-windows-powershell" --cwd "$env:GITHUB_WORKSPACE" --request - --today $today
      - name: Bash transport smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          today="$(python -c 'from datetime import date; print(date.today().isoformat())')"
          python plugins/tracebook/skills/tracebook/scripts/tracebook_request_envelope.py --request tests/fixtures/multilingual-request.json |
            python plugins/tracebook/skills/tracebook/scripts/tracebook_runner.py capture --root "$RUNNER_TEMP/tracebook-bash" --cwd "$GITHUB_WORKSPACE" --request - --today "$today"
      - name: Zsh transport smoke test
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: |
          today="$(python -c 'from datetime import date; print(date.today().isoformat())')"
          python plugins/tracebook/skills/tracebook/scripts/tracebook_request_envelope.py --request tests/fixtures/multilingual-request.json |
            python plugins/tracebook/skills/tracebook/scripts/tracebook_runner.py capture --root "$RUNNER_TEMP/tracebook-zsh" --cwd "$GITHUB_WORKSPACE" --request - --today "$today"
      - name: Validate Skill package
        run: python plugins/tracebook/skills/tracebook/scripts/validate_skill_package.py
      - name: Compile Python sources
        run: python -m compileall -q plugins/tracebook/skills/tracebook/scripts tests
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          git diff --check "$base" "$head"
      - name: Check pushed whitespace
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{object}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" "$head"
